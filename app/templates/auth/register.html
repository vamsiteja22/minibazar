{% extends "base.html" %}

{% block title %}Register - Mini Bazaar{% endblock %}

{% block content %}
<section class="form-card">
    <h1>Create your account</h1>
    <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="role">I want to join as</label>
        <select id="role" name="role">
            {% for value, label in roles.items() %}
                <option value="{{ value }}" {% if value == selected_role %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>

        <label for="name">Full name</label>
        <input type="text" id="name" name="name" value="{{ request.form.get('name', '') }}" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ request.form.get('email', '') }}" required>

        <label for="password">Password (min 8 characters)</label>
        <input type="password" id="password" name="password" required>

        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" required>

        <button type="submit" class="btn btn-block">Register</button>
    </form>
    <p class="form-note">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
</section>
{% endblock %}
