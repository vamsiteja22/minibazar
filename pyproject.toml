[project]
name = "minibazar"
version = "1.0.0"
description = "Mini Bazaar - Hyperlocal E-Commerce Platform"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "python-dotenv>=1.0",
    "flask-migrate>=4.0",
    "flask-login>=0.6",
    "flask-wtf>=1.2",
    "psycopg2-binary>=2.9",
]

[tool.vercel]
entrypoint = "run:app"
